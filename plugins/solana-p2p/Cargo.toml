[package]
name = "solana-p2p-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Headers", "console"] }
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
