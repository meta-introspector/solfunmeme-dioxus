[package]
name = "solfunmeme-dioxus"
version = "2.0.0"
edition = "2021"

[lib]
name = "solfunmeme_dioxus"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.7", features = ["web", "mobile"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
walkdir = "2"
tantivy = "0.22"
regex = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "console"] }
js-sys = "0.3"
console_log = "1"
log = "0.4"
