[package]
name = "solfunmeme-dioxus"
version = "2.0.0"
edition = "2021"

[lib]
name = "solfunmeme_dioxus"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.7", features = ["web", "mobile"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ciborium = "0.2"
chrono = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
tantivy = "0.22"
regex = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "mdns", "gossipsub", "identify", "tokio"] }
erdfa-publish = { path = "../erdfa-publish", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "console"] }
js-sys = "0.3"
console_log = "1"
log = "0.4"
