name: Build All Platforms

on:
  push:
    branches: [main, feature/v2-minimal]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dx
        run: cargo install dioxus-cli

      - name: Build Web
        run: dx build --release --platform web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: solfunmeme-web
          path: target/dx/solfunmeme-dioxus/release/web/public/

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: android-actions/setup-android@v3

      - name: Install NDK 26
        run: sdkmanager "ndk;26.3.11579264" "platforms;android-33" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dx
        run: cargo install dioxus-cli

      - name: Build Android (${{ matrix.target }})
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: dx build --platform android --release --target ${{ matrix.target }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solfunmeme-android-${{ matrix.target }}
          path: target-wasm-solfunmeme/dx/**/outputs/apk/**/*.apk
          if-no-files-found: warn

  deploy:
    needs: [web, android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/v2-minimal'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: solana.solfunmeme.com
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "solfunmeme-web/*,solfunmeme-android-aarch64-linux-android/*"
          target: /var/www/solana.solfunmeme.com/
          strip_components: 1

  release:
    needs: [web, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            solfunmeme-android-*/**/*.apk
            solfunmeme-web/**
