name: Build All Platforms

on:
  push:
    branches: [main, feature/v2-minimal]
  workflow_dispatch:

jobs:
  build-dx:
    runs-on: ubuntu-latest
    steps:
      - uses: meta-introspector/checkout@v4
        with:
          repository: meta-introspector/dioxus
          submodules: false

      - uses: meta-introspector/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache dx binary
        id: cache-dx
        uses: meta-introspector/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dx-0.7.4-${{ runner.os }}

      - name: Build dx
        if: steps.cache-dx.outputs.cache-hit != 'true'
        run: |
          nix-shell -p rustc cargo openssl pkg-config --run \
            'cargo install --path packages/cli --root $HOME/.cargo'

      - uses: meta-introspector/upload-artifact@v4
        with:
          name: dx-binary
          path: ~/.cargo/bin/dx

  build:
    needs: [build-dx]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [web, android-aarch64, android-x86_64]
        include:
          - platform: web
            dx_args: "--release --platform web"
            artifact_path: "target/dx/solfunmeme-dioxus/release/web/public/"
            artifact_name: solfunmeme-web
          - platform: android-aarch64
            dx_args: "--platform android --release --target aarch64-linux-android"
            artifact_path: "target-wasm-solfunmeme/dx/**/outputs/apk/**/*.apk"
            artifact_name: solfunmeme-android-aarch64
          - platform: android-x86_64
            dx_args: "--platform android --release --target x86_64-linux-android"
            artifact_path: "target-wasm-solfunmeme/dx/**/outputs/apk/**/*.apk"
            artifact_name: solfunmeme-android-x86_64
    steps:
      - uses: meta-introspector/checkout@v4
        with:
          submodules: false

      - uses: meta-introspector/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: meta-introspector/download-artifact@v4
        with:
          name: dx-binary
          path: /usr/local/bin

      - name: Make dx executable
        run: chmod +x /usr/local/bin/dx

      - name: Build ${{ matrix.platform }}
        run: nix develop --command dx build ${{ matrix.dx_args }}

      - uses: meta-introspector/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/v2-minimal'
    steps:
      - uses: meta-introspector/download-artifact@v4
      - uses: meta-introspector/scp-action@v0.1.7
        with:
          host: solana.solfunmeme.com
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "solfunmeme-web/*,solfunmeme-android-aarch64/*"
          target: /var/www/solana.solfunmeme.com/
          strip_components: 1

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: meta-introspector/download-artifact@v4
      - uses: meta-introspector/action-gh-release@v2
        with:
          files: |
            solfunmeme-android-*/**/*.apk
            solfunmeme-web/**
